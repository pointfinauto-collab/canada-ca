<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canadian Flag</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        /* The flag uses an official 1:2 aspect ratio */
        .flag {
            display: flex;
            width: 600px;
            height: 300px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* Red side bars (each takes up 25% or 1 part of the 1:2:1 ratio) */
        .red-bar {
            flex: 1;
            background-color: #FF0000; /* Official Canadian Red */
        }

        /* Central white square (takes up 50% or 2 parts of the ratio) */
        .white-square {
            flex: 2;
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Sizing the SVG leaf inside the white center */
        .maple-leaf {
            width: 85%;
            height: 85%;
            fill: #FF0000;
        }
    </style>
</head>
<body>

    <div class="flag">
        <div class="red-bar"></div>
        <div class="white-square">
            <svg class="maple-leaf" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
                <path d="M 500,200 L 532,291 L 515,299 L 575,342 L 553,355 L 642,434 L 620,453 L 696,480 L 690,503 L 836,467 L 848,511 L 795,535 L 826,585 L 752,581 L 773,634 L 717,624 L 695,667 L 610,612 L 619,637 L 553,622 L 557,651 L 521,651 L 526,800 L 474,800 L 479,651 L 443,651 L 447,622 L 381,637 L 390,612 L 305,667 L 283,624 L 227,634 L 248,581 L 174,585 L 205,535 L 152,511 L 164,467 L 310,503 L 304,480 L 380,453 L 358,434 L 447,355 L 425,342 L 485,299 L 468,291 Z" />
            </svg>
        </div>
        <div class="red-bar"></div>
    </div>

</body>
</html>
